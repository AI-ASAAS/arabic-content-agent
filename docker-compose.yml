services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asaas-agent-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8085}:8085"
    environment:
      - LLM_BASE_URL=${LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODELS=${LLM_MODELS:-["google/gemini-2.5-flash","nvidia/nemotron-3-ultra-550b-a55b:free"]}
      - DATABASE_PATH=/app/data/app.db
      - AGENT_MAX_ITERATIONS=${AGENT_MAX_ITERATIONS:-2}
      - AGENT_QUALITY_THRESHOLD=${AGENT_QUALITY_THRESHOLD:-8}
    volumes:
      - asaas_agent_data:/app/data
    networks:
      - asaas-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asaas-agent-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5180}:80"
    depends_on:
      - backend
    networks:
      - asaas-network

networks:
  asaas-network:
    driver: bridge

volumes:
  asaas_agent_data:
    name: asaas_agent_data
