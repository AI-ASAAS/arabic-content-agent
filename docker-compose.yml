services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: asaas-n8n-server
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_HOST=${N8N_HOST:-localhost}
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Riyadh
      - TZ=Asia/Riyadh
      # SQLite optimization & auto-cleanup
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      # Code extensions & security
      - NODE_FUNCTION_ALLOW_BUILTIN=*
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./shared:/data/shared
    networks:
      - asaas-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asaas-ai-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5180}:80"
    depends_on:
      - n8n
    networks:
      - asaas-network

networks:
  asaas-network:
    driver: bridge

volumes:
  n8n_storage:
    name: asaas_n8n_storage
